name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# TEST-002: lưới an toàn cho mọi thay đổi. Bước nào đỏ thì CI đỏ — đã kiểm
# bằng cách cố tình phá một hành vi có test (xem README mục "CI đỏ khi cố tình phá").
jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    env:
      DB_USER: ci
      DB_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: ruff check
        working-directory: backend
        run: ruff check .
      - name: tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend (lint + type + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: eslint
        run: npm run lint
        working-directory: frontend
      - name: type + build
        run: npm run build
        working-directory: frontend
      - name: vitest
        run: npm test
        working-directory: frontend